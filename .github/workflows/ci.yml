name: CI

# Runs automatically on every pull request and on pushes to main.
# Green CI is required before a change can be merged.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, types, format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  backend-lint:
    name: Backend (ruff lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check backend/
      - run: uv run ruff format --check backend/

  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tinkerer
          POSTGRES_PASSWORD: tinkerer
          POSTGRES_DB: tinkerer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tinkerer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tinkerer:tinkerer@localhost:5432/tinkerer
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_BUCKET: tinkerer-lab
      ENVIRONMENT: test
      AUTH_TEST_MODE: "true"
      STAFF_EMAILS: staff@uni.edu
      JWT_SECRET: ci-dummy-secret-at-least-32-bytes-long-000
      GOOGLE_CLIENT_ID: ci-unused.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-unused
      GOOGLE_HOSTED_DOMAIN: uni.edu
      LAB_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      # MinIO no longer publishes images (Docker Hub and quay.io are gone, and
      # dl.min.io returns 410), and a service container can't pass `server /data`
      # anyway. Build the pinned upstream release (RELEASE.2025-10-15T17-29-55Z)
      # from source and run it in a step; the binary is cached by commit.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Cache MinIO binary
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/minio-bin
          key: minio-9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN=$HOME/minio-bin go install github.com/minio/minio@9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
      - name: Start MinIO
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        run: |
          nohup ~/minio-bin/minio server "$RUNNER_TEMP/minio-data" > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      - run: uv run pytest
