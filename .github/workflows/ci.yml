name: CI

# Runs automatically on every pull request and on pushes to main.
# Green CI is required before a change can be merged.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, types, format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  backend-lint:
    name: Backend (ruff lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check backend/
      - run: uv run ruff format --check backend/

  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tinkerer
          POSTGRES_PASSWORD: tinkerer
          POSTGRES_DB: tinkerer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tinkerer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tinkerer:tinkerer@localhost:5432/tinkerer
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_BUCKET: tinkerer-lab
      ENVIRONMENT: test
      AUTH_TEST_MODE: "true"
      STAFF_EMAILS: staff@uni.edu
      JWT_SECRET: ci-dummy-secret-at-least-32-bytes-long-000
      GOOGLE_CLIENT_ID: ci-unused.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-unused
      GOOGLE_HOSTED_DOMAIN: uni.edu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      # A service container can't pass `server /data`, and Docker Hub no longer
      # serves minio/minio, so MinIO runs as a plain step from quay.io.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - run: uv run pytest
