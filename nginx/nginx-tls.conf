# Variant of nginx.conf for when THIS host terminates HTTPS — a university VM
# with a certificate from IT, rather than a reverse proxy or tunnel in front.
# Activate by setting these in .env, then `docker compose up -d nginx`:
#
#   NGINX_CONF=nginx-tls.conf
#   TLS_CERT_DIR=/etc/ssl/tinkerer     # must contain fullchain.pem + privkey.pem
#   HTTP_BIND=80
#
# and publish 443 as well (docker-compose.yml ports). Everything below the
# TLS plumbing is identical to nginx.conf — keep the two in step.

events {}

http {
    resolver 127.0.0.11 valid=10s;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    # Plain HTTP exists only to send people to HTTPS.
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Only safe once the certificate is known good — a browser that has
        # seen this header refuses plain HTTP to this host until it expires.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        set $minio_upstream minio:9000;
        set $backend_upstream backend:8000;
        set $frontend_upstream frontend:3000;

        location /tinkerer-lab {
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_pass http://$minio_upstream;
            # $http_host keeps the port: presigned URLs are signed for host:port.
            proxy_set_header Host $http_host;
        }

        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            client_max_body_size 10m;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
        }
    }
}
