events {}

http {
    # Docker's embedded DNS. Using variables in proxy_pass forces nginx to
    # re-resolve on each request instead of caching the container IP at
    # startup — otherwise nginx 502s after a service is recreated.
    resolver 127.0.0.11 valid=10s;

    # Credential stuffing against the OAuth entry points is the one endpoint
    # worth throttling. General /api/ is left alone on purpose: the whole
    # university shares a handful of NAT addresses, so a per-IP limit there
    # would throttle a full lab as if it were one abuser.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    server {
        listen 80;

        # Uploaded files are served from this same origin, so nosniff is what
        # stops a crafted upload being interpreted as HTML by a browser that
        # ignores the stored content type.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        set $minio_upstream minio:9000;
        set $backend_upstream backend:8000;
        set $frontend_upstream frontend:3000;

        # Public S3 route: presigned upload/download straight to MinIO. Path
        # prefix must match MINIO_BUCKET. Size limits are enforced by the
        # presigned policy + confirm step, not nginx.
        # No trailing slash: presigned POST targets /tinkerer-lab itself and a
        # slashed prefix would 301 it.
        location /tinkerer-lab {
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_pass http://$minio_upstream;
            # $http_host keeps the port: presigned URLs are signed for host:port.
            proxy_set_header Host $http_host;
        }

        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            # JSON only (file bytes never pass here), but TipTap documents
            # can outgrow the 1m default.
            client_max_body_size 10m;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
        }
    }
}
