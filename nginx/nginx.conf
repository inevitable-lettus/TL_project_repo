events {}

http {
    server {
        listen 80;

        # Public S3 route: presigned upload/download straight to MinIO. Path
        # prefix must match MINIO_BUCKET. Size limits are enforced by the
        # presigned policy + confirm step, not nginx.
        # No trailing slash: presigned POST targets /tinkerer-lab itself and a
        # slashed prefix would 301 it.
        location /tinkerer-lab {
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
        }
    }
}
