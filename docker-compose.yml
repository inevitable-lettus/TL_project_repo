services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    expose:
      - "3000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  cleanup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.app.cleanup"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    # Compressed pg_dump on an interval, pruned after BACKUP_KEEP_DAYS.
    # ./backups is a host bind mount so dumps survive `down -v`.
    command:
      - |
        while true; do
          PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -F c -f "/backups/tinkerer-$$(date +%Y%m%d-%H%M%S).dump"
          find /backups -name '*.dump' -mtime "+$${BACKUP_KEEP_DAYS:-14}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"
        done
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
