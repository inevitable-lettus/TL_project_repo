# Data locations are env-driven so one file serves both machines. A bare name
# (the default) is a Docker named volume; an absolute path is a host bind
# mount. On the server set PGDATA_PATH/MINIODATA_PATH to real directories
# under /srv/tinkerer so the data is visible to backups and snapshots and
# `down -v` cannot erase it. See docs/deployment.md.

# Containers restarted forever would otherwise fill the disk with logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_BIND:-80}:80"
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    expose:
      - "3000"
    healthcheck:
      # Port-listening check only: hitting / would SSR against the backend and
      # report the frontend unhealthy whenever the backend is the thing down.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *logging
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  cleanup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.app.cleanup"]
    restart: unless-stopped
    logging: *logging
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    # Compressed pg_dump on an interval, pruned after BACKUP_KEEP_DAYS.
    # The backup directory is a host bind mount so dumps survive `down -v`.
    command:
      - |
        while true; do
          PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -F c -f "/backups/tinkerer-$$(date +%Y%m%d-%H%M%S).dump"
          find /backups -name '*.dump' -mtime "+$${BACKUP_KEEP_DAYS:-14}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"
        done
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  backup-files:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    restart: unless-stopped
    logging: *logging
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    # The DB dump alone is not a backup of this app — the photos, write-up
    # media and CAD files all live in MinIO. Mirrored through the S3 API
    # rather than tarring the data directory, which cannot be read
    # consistently while MinIO is writing to it.
    # Deliberately no --remove: an accidental project delete must not erase
    # the only surviving copy on the next cycle.
    command:
      - |
        while true; do
          mcli alias set store "http://minio:9000" "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" &&
          mcli mirror --overwrite "store/$$MINIO_BUCKET" /backups/objects
          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"
        done
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      minio:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PGDATA_PATH:-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ${MINIODATA_PATH:-miniodata}:/data
    healthcheck:
      test: ["CMD-SHELL", "mcli ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
